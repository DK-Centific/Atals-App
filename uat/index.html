<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Atlas Scheduling | Desktop</title>
    <meta name="theme-color" content="#1A1C1E" />
    <link rel="icon" type="image/png" sizes="32x32" href="/Atals-App/uat/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/Atals-App/uat/icons/favicon-16.png" />
    <!-- Installable app. The Admin manifest and touch icon (name "Atlas Admin") are swapped in after an Admin signs in. -->
    <link rel="manifest" id="atlas-manifest" href="/Atals-App/uat/manifest.webmanifest" />
    <link rel="apple-touch-icon" id="atlas-touch-icon" href="/Atals-App/uat/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" id="atlas-app-title" content="Atlas" />
    <script>
      // A signed-in Admin installs "Atlas Admin". The browser reads the manifest as the page
      // loads, so pick it here, before that, from the saved sign-in (role only, nothing else).
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('atlas_session_v1') || 'null')
          if (!s || !s.user || String(s.user.role).toLowerCase() !== 'admin' || !(Date.parse(s.expiresAt) > Date.now())) return
          var m = document.getElementById('atlas-manifest')
          var t = document.getElementById('atlas-touch-icon')
          m.setAttribute('href', m.getAttribute('href').replace('manifest.webmanifest', 'manifest-admin.webmanifest'))
          t.setAttribute('href', t.getAttribute('href').replace('apple-touch-icon.png', 'apple-touch-icon-admin.png'))
          document.getElementById('atlas-app-title').setAttribute('content', 'Atlas Admin')
        } catch (e) { /* storage off: plain "Atlas" */ }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" crossorigin href="/Atals-App/uat/assets/index-DbjfQ4xw.css">
  </head>

  </body>
</html>
